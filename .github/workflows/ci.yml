name: C11 codec tests
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host dependencies
        run: pkg-config --exists zlib openssl
      - name: Build, test and example
        run: make clean all test example test-host
      - name: Sanitizers
        run: make sanitize sanitize-host
